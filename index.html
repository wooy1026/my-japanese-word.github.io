<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 일본어 단어</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root{
    --bg: #FAF6FF;
    --bg-2: #F3EEFB;
    --card: #FFFFFF;
    --lavender: #D8CFEF;
    --lavender-deep: #B9A9DA;
    --mint: #C3EAD9;
    --mint-deep: #8FCDB4;
    --peach: #FFDDC9;
    --peach-deep: #F5B990;
    --ink: #4B4459;
    --ink-soft: #8A8098;
    --line: #E7DFF5;
    --shadow: 0 20px 40px -20px rgba(107, 87, 145, 0.35);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, var(--mint) 0%, transparent 32%),
      radial-gradient(circle at 90% 12%, var(--peach) 0%, transparent 30%),
      radial-gradient(circle at 85% 90%, var(--lavender) 0%, transparent 35%),
      var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 48px 20px 80px;
  }

  .eyebrow{
    font-size: 13px;
    letter-spacing: 0.18em;
    color: var(--lavender-deep);
    font-weight: 700;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  h1{
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .date{ font-size: 14px; color: var(--ink-soft); margin-bottom: 10px; }
  .status{ font-size: 12px; color: var(--lavender-deep); margin-bottom: 26px; min-height: 16px; }

  .stage{ width: 100%; max-width: 420px; perspective: 1600px; }

  .card{
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{ transform: rotateY(180deg); }

  .face{
    position:absolute; inset:0;
    backface-visibility: hidden;
    border-radius: 28px;
    background: var(--card);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 32px 28px; text-align:center; overflow:hidden;
  }

  .ring{ position:absolute; top: 16px; width: 14px; height:14px; border-radius:50%;
    background: var(--bg-2); box-shadow: inset 0 2px 4px rgba(107,87,145,0.25); }
  .ring.left{ left: 40px; } .ring.right{ right: 40px; }

  .back{ transform: rotateY(180deg); background: linear-gradient(160deg, #ffffff, var(--bg-2)); }

  .pos-pill{
    display:inline-block; font-size: 12px; font-weight: 700; padding: 5px 14px;
    border-radius: 999px; background: var(--mint); color: #2E6650; margin-bottom: 22px; letter-spacing: 0.02em;
  }
  .pos-pill.verb{ background: var(--peach); color: #8A4B1E; }
  .pos-pill.adj{ background: var(--lavender); color: #4C3A78; }

  .word-main{
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 50px; font-weight: 700; line-height: 1.25; margin-bottom: 14px; word-break: keep-all;
  }
  .romaji{ font-size: 15px; color: var(--ink-soft); letter-spacing: 0.04em; margin-bottom: 28px; }
  .hint{ font-size: 13px; color: var(--lavender-deep); font-weight: 500; }

  .level-tag{
    position:absolute; top: 46px; right: 22px; font-size: 11px; font-weight: 700;
    color: var(--peach-deep); background: #FFF3E9; padding: 4px 10px; border-radius: 999px; border: 1px solid #FBDFC6;
  }

  .kana{ font-family: 'Zen Maru Gothic', sans-serif; font-size: 22px; color: var(--lavender-deep); margin-bottom: 10px; }
  .meaning{ font-size: 22px; font-weight: 700; margin-bottom: 18px; word-break: keep-all; }

  .example{ background: var(--bg); border-radius: 16px; padding: 16px 18px; font-size: 14px; line-height: 1.65; width: 100%; }
  .example .jp{ font-family: 'Zen Maru Gothic', sans-serif; font-weight: 500; margin-bottom: 6px; color: var(--ink); }
  .example .kr{ color: var(--ink-soft); }

  .source-note{
    font-size: 12px; color: var(--ink-soft); background: var(--bg);
    border-radius: 16px; padding: 14px 16px; width: 100%; line-height: 1.6;
  }

  .controls{ display:flex; gap: 12px; margin-top: 26px; width: 100%; max-width: 420px; }

  button{
    font-family: 'Noto Sans KR', sans-serif; border: none; cursor:pointer; border-radius: 14px;
    padding: 14px 18px; font-size: 14px; font-weight: 700;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:active{ transform: scale(0.97); }

  .btn-flip{ flex: 1; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn-flip:hover{ box-shadow: 0 8px 20px -10px rgba(107,87,145,0.4); }

  .btn-check{
    flex: 1.4; background: linear-gradient(135deg, var(--mint-deep), var(--mint));
    color: #1E4335; box-shadow: 0 12px 24px -12px rgba(143,205,180,0.9);
  }
  .btn-check.done{ background: linear-gradient(135deg, #E4DBFA, var(--lavender)); color: #4C3A78; }

  .levels{ margin-top: 40px; width: 100%; max-width: 420px; }
  .levels-title{ font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 12px; }
  .chips{ display:flex; gap: 8px; flex-wrap: wrap; }
  .chip{
    font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer; user-select: none;
  }
  .chip.active{ background: linear-gradient(135deg, var(--lavender-deep), var(--lavender)); color: #fff; border-color: transparent; }
  .pool-count{ font-size: 12px; color: var(--ink-soft); margin-top: 10px; }

  .streak{ margin-top: 40px; width: 100%; max-width: 420px; }
  .streak-title{ font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 14px; display:flex; justify-content: space-between; align-items:center; }
  .streak-count{ color: var(--lavender-deep); font-family: 'Zen Maru Gothic', sans-serif; }
  .dots{ display:flex; gap: 8px; justify-content: space-between; }
  .dot-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .dot{ width: 100%; aspect-ratio: 1; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
  .dot.filled{ background: linear-gradient(135deg, var(--mint-deep), var(--mint)); border-color: transparent; }
  .dot.today{ box-shadow: 0 0 0 2px var(--lavender-deep); }
  .dot-label{ font-size: 10px; color: var(--ink-soft); }

  footer{ margin-top: 50px; font-size: 12px; color: var(--ink-soft); text-align:center; max-width: 420px; line-height:1.6; }
  footer a{ color: var(--lavender-deep); }

  @media (max-width: 420px){ .word-main{ font-size: 40px; } h1{ font-size: 26px; } }
</style>
</head>
<body>

  <div class="eyebrow">一日一語 · 하루 한 단어</div>
  <h1>오늘의 일본어 단어</h1>
  <div class="date" id="dateLabel"></div>
  <div class="status" id="statusLabel">단어 데이터 불러오는 중...</div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="ring left"></div>
        <div class="ring right"></div>
        <span class="pos-pill" id="posPillFront">단어</span>
        <div class="word-main" id="wordMain">…</div>
        <div class="romaji" id="romaji"></div>
        <div class="hint">카드를 눌러 뜻을 확인하세요</div>
      </div>
      <div class="face back">
        <div class="level-tag" id="levelTag">N5</div>
        <div class="kana" id="kana"></div>
        <div class="meaning" id="meaning"></div>
        <div class="example" id="exampleBox" style="display:none;">
          <div class="jp" id="exJp"></div>
          <div class="kr" id="exKr"></div>
        </div>
        <div class="source-note" id="sourceNote" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-flip" id="flipBtn">카드 뒤집기</button>
    <button class="btn-check" id="checkBtn">오늘 학습 완료</button>
  </div>

  <div class="levels">
    <div class="levels-title">단어 범위 (JLPT 급수 선택)</div>
    <div class="chips" id="chips"></div>
    <div class="pool-count" id="poolCount"></div>
  </div>

  <div class="streak">
    <div class="streak-title">
      <span>최근 7일 학습 기록</span>
      <span class="streak-count" id="streakCount">0일 완료</span>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <footer>
    단어는 매일 자정 기준으로 바뀌며, 선택한 급수의 전체 단어 풀을 순환합니다.<br>
    확장 단어 데이터 출처: <a href="https://github.com/jamsinclair/open-anki-jlpt-decks" target="_blank" rel="noopener">open-anki-jlpt-decks</a>
    (원본: tanos.co.uk, CC BY) · 기본 80단어는 직접 제작한 한국어 세트입니다.
  </footer>

    const v = localStorage.getItem(k);

  set: async (k, v) => { localStorage.setItem(k, v); return { key: k, value: v }; },

/* ---------- 확장 데이터: 공개 JLPT 데이터셋을 API처럼 fetch (raw.githubusercontent.com은 CORS 허용) ---------- */
const LEVELS = ['N5','N4','N3','N2','N1'];
const CSV_URL = lv => `https://raw.githubusercontent.com/jamsinclair/open-anki-jlpt-decks/main/src/${lv.toLowerCase()}.csv`;

function parseCSVLine(line){
  const out = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(c === '"'){
      if(inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if(c === ',' && !inQuotes){
      out.push(cur); cur = '';
    } else {
      cur += c;
    }
  }
  out.push(cur);
  return out;
}

async function fetchLevel(lv){
  const res = await fetch(CSV_URL(lv));
  if(!res.ok) throw new Error('fetch failed: ' + lv);
  const text = await res.text();
  const lines = text.split('\n').filter(l => l.trim().length > 0);
  const curatedSet = new Set(CURATED.map(w => w.k));
  return lines.map(line => {
    const cols = parseCSVLine(line);
    const k = (cols[0] || '').trim();
    const r = (cols[1] || '').trim();
    const m = (cols[2] || '').trim();
    if(!k || !r || !m) return null;
    if(curatedSet.has(k)) return null;
    return { k, r, ro:'', m, p:'', l: lv, lang:'en' };
  }).filter(Boolean);
}

let selectedLevels = new Set(['N5','N4']);
let levelCache = {};
let pool = [];

function dayOfYear(d){ const start = new Date(d.getFullYear(), 0, 0); return Math.floor((d - start) / 86400000); }
function dateKey(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

const today = new Date();
const todayKey = dateKey(today);
document.getElementById('dateLabel').textContent =
  today.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

async function loadSelectedLevels(){
  const statusEl = document.getElementById('statusLabel');
  statusEl.textContent = '단어 데이터 불러오는 중...';
  const toFetch = [...selectedLevels].filter(lv => !levelCache[lv]);
  let anyFailed = false;
  await Promise.all(toFetch.map(async lv => {
    try{ levelCache[lv] = await fetchLevel(lv); }
    catch(e){ anyFailed = true; levelCache[lv] = []; }
  }));
  pool = [...CURATED, ...[...selectedLevels].flatMap(lv => levelCache[lv] || [])];
  document.getElementById('poolCount').textContent = `현재 ${pool.length.toLocaleString()}개 단어가 순환 중입니다.`;
  statusEl.textContent = anyFailed ? '일부 데이터를 불러오지 못해 기본 세트로 대체했어요.' : '';
  renderToday();
}

function renderToday(){
  if(pool.length === 0) return;
  const idx = dayOfYear(today) % pool.length;
  const word = pool[idx];

  document.getElementById('wordMain').textContent = word.k;
  document.getElementById('romaji').textContent = word.ro || '';
  document.getElementById('kana').textContent = word.r;
  document.getElementById('meaning').textContent = word.m;
  document.getElementById('levelTag').textContent = word.l;

  const posEl = document.getElementById('posPillFront');
  if(word.p){
    posEl.style.display = '';
    posEl.textContent = word.p;
    posEl.className = 'pos-pill' + (word.p === '동사' ? ' verb' : (word.p.includes('형용사') ? ' adj' : ''));
  } else {
    posEl.style.display = 'none';
  }

  const exampleBox = document.getElementById('exampleBox');
  const sourceNote = document.getElementById('sourceNote');
  if(word.lang === 'ko' && word.e){
    exampleBox.style.display = '';
    document.getElementById('exJp').textContent = word.e;
    document.getElementById('exKr').textContent = word.em;
    sourceNote.style.display = 'none';
  } else {
    exampleBox.style.display = 'none';
    sourceNote.style.display = '';
    sourceNote.textContent = '공개 JLPT 단어 데이터셋에서 가져온 단어예요. 뜻은 영어 사전 기준입니다.';
  }
}

const card = document.getElementById('card');
document.getElementById('flipBtn').addEventListener('click', () => card.classList.toggle('flipped'));
card.addEventListener('click', () => card.classList.toggle('flipped'));

const checkBtn = document.getElementById('checkBtn');

async function refreshCheckState(){
  try{
    const res = await storageAPI.get(`checkin:${todayKey}`);
    checkBtn.textContent = res ? '오늘 학습 완료 ✓' : '오늘 학습 완료';
    checkBtn.classList.toggle('done', !!res);
  }catch(e){
    checkBtn.textContent = '오늘 학습 완료';
    checkBtn.classList.remove('done');
  }
}

checkBtn.addEventListener('click', async () => {
  try{
    let existing = null;
    try{ existing = await storageAPI.get(`checkin:${todayKey}`); }catch(e){ existing = null; }
    if(existing) await storageAPI.delete(`checkin:${todayKey}`);
    else await storageAPI.set(`checkin:${todayKey}`, '1');
  }catch(e){ console.error('storage error', e); }
  await refreshCheckState();
  await renderStreak();
});

async function renderStreak(){
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  let count = 0;
  for(let i=6;i>=0;i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = dateKey(d);
    let filled = false;
    try{ filled = !!(await storageAPI.get(`checkin:${key}`)); }catch(e){ filled = false; }
    if(filled) count++;

    const wrap = document.createElement('div');
    wrap.className = 'dot-wrap';
    const dot = document.createElement('div');
    dot.className = 'dot' + (filled ? ' filled' : '') + (key === todayKey ? ' today' : '');
    const label = document.createElement('div');
    label.className = 'dot-label';
    label.textContent = ['일','월','화','수','목','금','토'][d.getDay()];
    wrap.appendChild(dot); wrap.appendChild(label);
    dotsEl.appendChild(wrap);
  }
  document.getElementById('streakCount').textContent = `${count}일 완료`;
}

async function loadLevelPref(){
  try{
    const res = await storageAPI.get('levels-pref');
    if(res && res.value){
      const arr = JSON.parse(res.value);
      if(Array.isArray(arr) && arr.length) selectedLevels = new Set(arr);
    }
  }catch(e){ /* 기본값 유지 */ }
}

function renderChips(){
  const chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = '';
  LEVELS.forEach(lv => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selectedLevels.has(lv) ? ' active' : '');
    chip.textContent = lv;
    chip.addEventListener('click', async () => {
      if(selectedLevels.has(lv)){
        if(selectedLevels.size === 1) return;
        selectedLevels.delete(lv);
      } else {
        selectedLevels.add(lv);
      }
      renderChips();
      try{ await storageAPI.set('levels-pref', JSON.stringify([...selectedLevels])); }catch(e){}
      await loadSelectedLevels();
    });
    chipsEl.appendChild(chip);
  });
}

(async function init(){
  await loadLevelPref();
  renderChips();
  await refreshCheckState();
  await renderStreak();
  await loadSelectedLevels();
})();
